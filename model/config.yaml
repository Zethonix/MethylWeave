# MethylWeave architecture and training defaults.
model:
  model_dim: 128
  raw_signal_len: 16
  seq_multik_values: "1,3,5,7"
  fixed_readout_index: 7
  seq_dropout_prob: 0.15
  protect_center_window: 2
  use_contrastive_projection_head: true
  contrast_projection_dim: 128
  contrast_projection_hidden_dim: 128
  contrast_temperature: 0.50
  loss_alpha: 0.10
  loss_balance_mode: warmup_ema_norm
  loss_balance_warmup_steps: 500
  loss_balance_ema_beta: 0.98
  loss_ref_contrast_init: 0.08
  loss_ref_ce_init: 0.02
  loss_balance_freeze_after_warmup: true
  loss_balance_target_scale: 0.0
training:
  batch_size: 512
  devices: 2
  epochs: 30
  precision: 16
  workers: 8
  prefetch_factor: 4
  learning_rate: 0.0002
  weight_decay: 0.01
  cosine_t_max: 30
  eta_min: 0.000001
  gradient_clip: 1.0
  early_stop_patience: 4
  early_stop_min_delta: 0.0001
  matmul_precision: high
